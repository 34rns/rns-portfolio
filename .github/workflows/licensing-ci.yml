name: Licensing checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --config src/themes/professional/components/brand-logo/vitest.config.mts --maxWorkers=2
      - run: npm run licensing:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install './sdks/python[fastapi,test]'
      - run: python -m pytest sdks/python/tests
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go test ./...
        working-directory: sdks/go
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -d extension=sodium sdks/php/tests/contract.php
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project sdks/dotnet/KeyGate.Tests
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: sdks/dart
      - run: dart test
        working-directory: sdks/dart
  swift:
    # Manual opt-in only: check private-repository runner allowances first.
    if: github.event_name == 'workflow_dispatch' && vars.KEYGATE_ENABLE_MACOS_CI == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: sdks/swift
